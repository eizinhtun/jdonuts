name: jdonuts
description: Offline-first J’Donuts code test app.
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: ^3.13.4
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.0.0
  go_router: ^16.2.0
  drift: ^2.28.1
  sqlite3_flutter_libs: ^0.5.39
  path_provider: ^2.1.5
  flutter_secure_storage: ^9.2.4
  connectivity_plus: ^7.0.0
  http: ^1.5.0
  cached_network_image: ^3.4.1
  intl: ^0.20.2
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.3.2
  characters: ^1.4.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.28.1
  build_runner: ^2.7.1
flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/data/seed.json
    - assets/images/
